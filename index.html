<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coupon Math</title><meta name="description" content="Plan your shopping trips in minutes.">
<link rel="icon" href="/icon.png"><link rel="apple-touch-icon" href="/icon.png">
<meta property="og:title" content="Coupon Math"><meta property="og:description" content="Plan your shopping trips in minutes."><meta property="og:image" content="https://couponmath.com/icon.png">
<style>*{box-sizing:border-box;margin:0;padding:0}
:root{--blue:#0071E3;--text:#1C1C1E;--muted:#6B7280;--line:#E5E7EB;--bg:#F5F7FA}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
main{flex:1;width:100%;max-width:480px;margin:0 auto;padding:40px 20px 24px}
a{color:var(--blue);text-decoration:none}
.center{text-align:center}
.icon{width:96px;height:96px;border-radius:22px;box-shadow:0 6px 18px rgba(0,113,227,.25)}
h1{font-size:28px;font-weight:800;margin-top:14px}
.tag{color:var(--muted);font-size:16px;margin-top:4px}
.blurb{font-size:15px;color:#374151;margin:18px auto 24px;line-height:1.5;max-width:400px;text-wrap:balance}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border-radius:14px;padding:16px;font-weight:700;font-size:16px;margin-bottom:12px;background:#fff;border:1px solid var(--line);color:var(--text);cursor:pointer;font-family:inherit}
.btn:active{opacity:.8}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.notify{background:#E8F2FC;border-color:#B5D5F5;color:var(--blue)}
.btn svg{width:24px;height:24px;flex-shrink:0}
footer{text-align:center;font-size:13px;color:var(--muted);padding:18px 16px 28px}
footer a{margin:0 6px;font-weight:600;display:inline-block;padding:4px 0}
.back{display:inline-block;font-weight:600;font-size:15px;margin-bottom:16px}
h2{font-size:26px;font-weight:800;margin-bottom:8px}
.p{font-size:15px;color:#374151;line-height:1.55;margin-bottom:16px}
.h3{font-weight:800;font-size:16px;margin:18px 0 8px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.mail{font-weight:700;font-size:16px}
.li{padding:12px 0;border-bottom:1px solid #F1F3F5}.li:last-child{border:0}
.li b{display:block;font-size:15.5px}.li span{font-size:14px;color:#4B5563}
.legal{white-space:pre-wrap;font-size:15px;line-height:1.6;color:#374151}
.muted{color:var(--muted);font-size:14px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
.modal.open{display:flex}
.sheet{background:#fff;width:100%;max-width:560px;height:88vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden}
@media(min-width:640px){.modal{align-items:center}.sheet{border-radius:18px;height:80vh}}
.sh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);font-weight:800;font-size:17px}
.x{width:32px;height:32px;border-radius:16px;background:#F1F3F5;border:0;font-size:16px;color:#4B5563;cursor:pointer}
iframe{flex:1;width:100%;border:0}
</style></head><body>
<main class="center">
<img class="icon" src="/icon.png" alt="Coupon Math app icon">
<h1>Coupon Math</h1>
<div class="tag">Every deal has a little math.</div>
<p class="blurb">Plan your shopping trips in minutes. Browse weekly deals, organize them into transactions, and see estimated totals and rewards before you shop.</p>
<!-- BEFORE LAUNCH: "Get notified" button. AFTER LAUNCH: set LAUNCHED to true in the script at the bottom. -->
<button class="btn notify" id="notifyBtn" type="button"><svg viewBox="0 0 24 24"><path d="M12 22a2 2 0 0 0 2-2h-4a2 2 0 0 0 2 2zm6-6V11a6 6 0 0 0-5-5.9V4a1 1 0 0 0-2 0v1.1A6 6 0 0 0 6 11v5l-2 2v1h16v-1l-2-2z" fill="#0071E3"/></svg>Get notified when it's available</button>
<a class="btn primary" id="storeBtn" href="https://apps.apple.com/app/id6812436686" style="display:none"><svg viewBox="0 0 24 24"><path fill="#fff" d="M16.4 12.6c0-2.4 2-3.5 2-3.6-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.2-2.8.8-3.5.8s-1.9-.8-3.1-.8a4.6 4.6 0 0 0-3.9 2.4c-1.7 2.9-.4 7.2 1.2 9.6.8 1.2 1.7 2.5 3 2.4 1.2 0 1.6-.8 3.1-.8s1.8.8 3.1.8c1.3 0 2.1-1.2 2.9-2.4a10 10 0 0 0 1.3-2.7c0 0-2.6-1-2.7-3.9zM14 5.5c.7-.8 1.1-1.9 1-3-1 0-2.1.7-2.8 1.5-.6.7-1.2 1.8-1 2.9 1 .1 2.1-.6 2.8-1.4z"/></svg>Download on the App Store</a>
<a class="btn" href="https://www.tiktok.com/@hannah.vina" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><rect width="24" height="24" rx="6" fill="#010101"/><path d="M15.6 5.5c.4 1.3 1.4 2.3 2.7 2.6v2.3c-1 0-2-.3-2.8-.8v4.6a4 4 0 1 1-4-4c.2 0 .4 0 .6.1v2.4a1.7 1.7 0 1 0 1.1 1.6V5.5h2.4z" fill="#fff"/></svg>TikTok</a>
<a class="btn" href="https://www.instagram.com/hannahvina_/" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><defs><linearGradient id="g" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#F58529"/><stop offset=".5" stop-color="#DD2A7B"/><stop offset="1" stop-color="#8134AF"/></linearGradient></defs><rect width="24" height="24" rx="6" fill="url(#g)"/><rect x="6" y="6" width="12" height="12" rx="3.5" fill="none" stroke="#fff" stroke-width="1.6"/><circle cx="12" cy="12" r="2.9" fill="none" stroke="#fff" stroke-width="1.6"/><circle cx="15.6" cy="8.4" r=".9" fill="#fff"/></svg>Instagram</a>
</main>
<footer><a href="/support">Support</a> · <a href="/privacy">Privacy Policy</a> · <a href="/terms">Terms &amp; Conditions</a></footer>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Get notified">
  <div class="sheet"><div class="sh">Get notified<button class="x" id="closeBtn" type="button" aria-label="Close">✕</button></div>
  <iframe id="formFrame" title="Get notified form" loading="lazy"></iframe></div>
</div>
<script>
var LAUNCHED = false; // change to true once the app is on the App Store
var FORM = "https://docs.google.com/forms/d/e/1FAIpQLSd6IwvllFzn-b_amQvd1D0dQmz3m3E_ejZ-zOZYL_YsbBzPGw/viewform?embedded=true";
var modal = document.getElementById('modal'), frame = document.getElementById('formFrame');
if (LAUNCHED) { document.getElementById('notifyBtn').style.display = 'none'; document.getElementById('storeBtn').style.display = 'flex'; }
document.getElementById('notifyBtn').onclick = function () { if (!frame.src) frame.src = FORM; modal.classList.add('open'); document.body.style.overflow = 'hidden'; };
function closeModal() { modal.classList.remove('open'); document.body.style.overflow = ''; }
document.getElementById('closeBtn').onclick = closeModal;
modal.onclick = function (e) { if (e.target === modal) closeModal(); };
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });
</script>
</body></html>
